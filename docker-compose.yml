# Local development database. Credentials here are for local use only.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kidty
      POSTGRES_PASSWORD: kidty
      POSTGRES_DB: kidty
    ports:
      - '5434:5432'
    volumes:
      - kidty-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kidty -d kidty']
      interval: 5s
      timeout: 3s
      retries: 10

  # Catches outgoing email in development: SMTP on 1025, inbox at http://localhost:8025
  mail:
    image: axllent/mailpit:v1.31.4
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  kidty-db:
